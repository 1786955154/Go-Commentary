# ============================================
# KataGo C++ Analysis Engine Configuration
# Optimized for single GPU + multi-threaded CPU
# ============================================

# Logs
logDir = analysis_logs        # 日志输出目录
logToStderr = true            # 输出到控制台
logErrorsAndWarnings = true   # 错误和警告也输出

# Analysis
reportAnalysisWinratesAs = BLACK
maxVisits = 500               # 最大搜索次数
maxTime = 10               # 可选：限制搜索时间（秒）

# Threads & GPU
numAnalysisThreads = 8                     # 并行分析局面数
numSearchThreadsPerAnalysisThread = 16      # 每局面搜索线程数
nnMaxBatchSize = 512                      # GPU 批量处理大小

# CUDA GPU settings
cudaDeviceToUse = 0                         # 单 GPU
numNNServerThreadsPerModel = 2              # 每个模型 GPU 线程

# Neural network cache
nnCacheSizePowerOfTwo = 26
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true

# Bot behavior
conservativePass = true
preventCleanupPhase = true
assumeMultipleStartingBlackMovesAreHandicap = true

# Misc
rootSymmetryPruning = true                  # 对称性剪枝
enablePassingHacks = true



# Optional: adjust temperature / exploration
chosenMoveTemperatureEarly = 0.5
chosenMoveTemperature = 0.10
